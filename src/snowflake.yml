definition_version: "2"

entities:
  pg_sync:
    type: snowflake-app
    identifier:
      name: PG_SYNC
      database: PGSYNC_DB
      schema: APP
    artifacts:
      - src: ./*
        dest: ./
        ignore:
          - node_modules
          - .env*
          - __pycache__
          - "*.pyc"
          - .next
          - .git
          - snowflake.log

    query_warehouse: PGSYNC_WH
    code_stage: PG_SYNC_CODE
